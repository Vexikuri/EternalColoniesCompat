modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Forever World compatibility project"
description='''Adds MineColonies tool-tier recognition for Eternal Tool 1.5.0 without modifying either original mod. Adds experimental verified MineColonies work XP and guard combat XP. Other player-only abilities are not enabled.'''

[[mixins]]
config="eternalcoloniescompat.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="eternaltool"
type="required"
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecolonies"
type="required"
versionRange="[1.1.1420-1.21.1,)"
ordering="AFTER"
side="BOTH"
